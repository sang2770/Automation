<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dau Anh Auto</title>
    <link rel="stylesheet" href="styles.css" />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="app-container">
      <header>
        <h1>Dau Anh Auto</h1>
        <p>Công cụ Soạn thảo Âm thanh Tự động</p>
        <div class="activation-info">
          <div class="device-info">
            <span class="device-label">ID Thiết bị:</span>
            <span id="device-id" class="device-id">Đang tải...</span>
            <button id="copy-device-id" class="btn-copy">Sao chép</button>
          </div>
          <div class="activation-status">
            <span id="activation-status" class="status-inactive"
              >Chưa kích hoạt</span
            >
            <button id="check-activation" class="btn-check">Kiểm tra</button>
          </div>
        </div>
      </header>

      <main>
        <!-- Input Section 1 -->
        <section class="input-card" id="input1">
          <div class="card-header">
            <span class="badge">Đầu vào 1</span>
            <h3>Thư mục Nguồn</h3>
          </div>
          <div class="control-group">
            <button class="btn-select" id="btn-input1">Chọn Thư mục</button>
            <span class="path-display" id="path-input1"
              >Chưa chọn thư mục...</span
            >
          </div>
          <div class="control-group">
            <label>Số lượng Bài:</label>
            <input
              type="number"
              id="count-input1"
              min="1"
              value="1"
              class="num-input"
            />
          </div>
        </section>

        <!-- Input Section 2 -->
        <section class="input-card" id="input2">
          <div class="card-header">
            <span class="badge">Đầu vào 2</span>
            <h3>Thư mục Nguồn</h3>
          </div>
          <div class="control-group">
            <button class="btn-select" id="btn-input2">Chọn Thư mục</button>
            <span class="path-display" id="path-input2"
              >Chưa chọn thư mục...</span
            >
          </div>
          <div class="control-group">
            <label>Số lượng Bài:</label>
            <input
              type="number"
              id="count-input2"
              min="1"
              value="1"
              class="num-input"
            />
          </div>
        </section>
        <!-- Settings -->
        <section class="settings-card">
          <div class="setting-row">
            <label class="checkbox-option" for="repeat-enabled">
              <input type="checkbox" id="repeat-enabled" />
              <span class="checkmark" aria-hidden="true">✓</span>
              <span>Lặp lại 2 đầu vào</span>
            </label>
          </div>

          <div class="setting-row">
            <label class="checkbox-option" for="random-speed-enabled">
              <input type="checkbox" id="random-speed-enabled" />
              <span class="checkmark" aria-hidden="true">✓</span>
              <span>Random tốc độ từng bài (±1–15%)</span>
            </label>
          </div>

          <div class="setting-row" id="repeat-count-row">
            <label for="repeat-count">Số vòng ghép (khi bật lặp):</label>
            <input
              type="number"
              id="repeat-count"
              min="1"
              value="1"
              class="num-input"
              style="width: 100px"
            />
          </div>

          <div class="setting-row">
            <label>Số lần chạy:</label>
            <input
              type="number"
              id="run-count"
              min="1"
              value="1"
              class="num-input"
              style="width: 100px"
            />
          </div>

          <div class="setting-row">
            <label>Thư mục Đầu ra:</label>
            <div class="control-group">
              <button class="btn-select secondary" id="btn-output">
                Chọn Đầu ra
              </button>
              <span class="path-display" id="path-output"
                >Chưa chọn thư mục...</span
              >
            </div>
          </div>
        </section>

        <!-- Actions -->
        <div class="actions">
          <button id="btn-process" class="btn-primary">Bắt đầu Xử lý</button>
        </div>

        <!-- Logs -->
        <div class="console-output">
          <div class="console-header">Nhật ký Trạng thái</div>
          <div id="log-content" class="log-content">Đang chờ bắt đầu...</div>
        </div>
      </main>
    </div>
    <script src="renderer.js"></script>
  </body>
</html>
```
